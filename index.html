<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081425">
<meta name="description" content="ব্যাচেলর জীবনের সকাল থেকে রাতের রুটিন, সাপ্তাহিক কাজ আর মাসিক খরচ এক জায়গায়।">
<title>ব্যাচেলর লাইফ · রুটিন প্ল্যানার</title>
<link rel="stylesheet" href="style.css?v=dashboard-2">
<link rel="stylesheet" href="night.css?v=dashboard-2">
<script src="routine.js" defer></script>
<script src="planner.js" defer></script>
<script src="night-scene.js" defer></script>
<script src="vault.js?v=2" defer></script>
<script src="night.js?v=2" defer></script>
</head>
<body>
<section id="night" class="night" aria-labelledby="night-title" data-lit="false">
  <canvas id="night-sky" aria-hidden="true"></canvas>
  <div class="night-brand"><span aria-hidden="true">⌂</span> ব্যাচেলর লাইফ</div>
  <div class="night-console">
    <div class="lamp-rig">
      <div class="lamp-light" aria-hidden="true"></div>
      <div class="lamp-wire" aria-hidden="true"></div>
      <div class="lamp-cap" aria-hidden="true"></div>
      <div class="lamp-bulb" aria-hidden="true"></div>
      <div class="lamp-shade" aria-hidden="true"></div>
      <button class="pull" id="light-pull" type="button" aria-label="দড়ি টেনে ল্যাম্প জ্বালান" aria-controls="welcome-action" aria-pressed="false"><span class="pull-line"></span><span class="pull-ring"></span></button>
    </div>
    <section id="welcome" class="night-card">
      <h1 id="night-title" tabindex="-1">ল্যাম্পটা জ্বালান<span>.</span></h1>
      <p id="night-copy">দড়ি ধরে নিচের দিকে টানুন বা দড়িতে ট্যাপ করুন।</p>
      <button class="night-primary" type="button" id="welcome-action" hidden>লগইন করুন</button>
    </section>
    <section id="login-panel" class="night-card" aria-labelledby="login-title" hidden>
      <h2 id="login-title"></h2>
      <p id="account-copy">এই ব্রাউজারে আপনার রুটিন ও খরচ সেভ থাকবে।</p>
      <form id="login-form" novalidate>
        <label id="name-label">আপনার নাম<input id="profile-name" autocomplete="username" maxlength="48" required></label>
        <label>পাসওয়ার্ড<input id="profile-password" type="password" maxlength="128" required></label>
        <label class="restore-choice" id="restore-label" hidden><input id="restore-data" type="checkbox" checked>আগের রুটিন এই প্রোফাইলে নিন</label>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="night-primary" id="login-submit" type="submit"></button>
        <button class="night-back" id="login-back" type="button">ফিরে যান</button>
      </form>
    </section>
  </div>
</section>
<div id="planner-shell" hidden>
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="./index.html"><span aria-hidden="true">⌂</span>ব্যাচেলর লাইফ</a>
    <nav class="tabs" aria-label="প্ল্যানারের বিভাগ">
      <button type="button" data-view="daily" aria-pressed="true">দৈনিক রুটিন</button>
      <button type="button" data-view="weekly" aria-pressed="false">সাপ্তাহিক কাজ</button>
      <button type="button" data-view="expenses" aria-pressed="false">মাসিক খরচ</button>
      <button class="sign-out" id="sign-out" type="button">লগআউট</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <div>
      <p id="period-label" class="period"></p>
      <h1 id="page-title" tabindex="-1">আজকের রুটিন</h1>
      <p id="page-description"></p>
    </div>
    <button type="button" class="primary" id="add-item"><span aria-hidden="true">+</span> কাজ যোগ করুন</button>
  </section>
  <p class="storage-notice" id="storage-notice" role="status" hidden>এই ব্রাউজারে তথ্য সেভ করা যাচ্ছে না। পেজ বন্ধ করলে বর্তমান পরিবর্তনগুলো হারিয়ে যেতে পারে।</p>
  <div class="content-grid">
    <section aria-label="নির্বাচিত সময়ের তালিকা">
      <div class="period-nav" aria-label="সময় বদলান">
        <button type="button" id="previous"></button>
        <button type="button" id="current"></button>
        <button type="button" id="next"></button>
      </div>
      <div id="entries"></div>
    </section>
    <aside id="summary" class="summary" aria-label="অগ্রগতি ও হিসাব"></aside>
  </div>
</main>
<template id="entry-template">
  <li class="entry">
    <input class="check" type="checkbox">
    <div class="entry-copy"><strong></strong><small></small></div>
    <div class="entry-actions">
      <button class="edit" type="button">বদলান</button>
      <button class="remove" type="button">মুছুন</button>
    </div>
  </li>
</template>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="edit-form">
    <h2 id="editor-title"></h2>
    <fieldset id="task-fields">
      <label>কাজের নাম<input id="task-title" maxlength="75" required></label>
      <label>সময়<input type="time" id="task-time" required></label>
    </fieldset>
    <fieldset id="weekly-fields" hidden disabled>
      <label>কাজের নাম<input id="weekly-title" maxlength="75" required></label>
      <label>যেদিন করতে চান<select id="weekly-day"></select></label>
    </fieldset>
    <fieldset id="expense-fields" hidden disabled>
      <label>খরচের তারিখ<input type="date" id="expense-date" required></label>
      <label>খরচের ধরন<select id="expense-category"></select></label>
      <label>টাকা<input id="expense-amount" inputmode="decimal" maxlength="16" placeholder="যেমন ২৫০" required></label>
      <label>বিবরণ (ঐচ্ছিক)<input id="expense-note" maxlength="90" placeholder="যেমন চাল ও ডিম"></label>
    </fieldset>
    <fieldset id="budget-fields" hidden disabled>
      <label>এই মাসের বাজেট<input id="budget-amount" inputmode="decimal" maxlength="16" placeholder="যেমন ১২০০০" required></label>
    </fieldset>
    <p id="form-error" class="form-error" role="alert" hidden></p>
    <div class="dialog-buttons"><button type="button" id="cancel-edit">বাতিল</button><button type="submit" class="primary">সেভ করুন</button></div>
  </form>
</dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <form method="dialog">
    <h2 id="delete-title">তালিকা থেকে মুছবেন?</h2>
    <p id="delete-copy"></p>
    <div class="dialog-buttons"><button value="cancel" autofocus>বাতিল</button><button value="delete" class="danger">মুছুন</button></div>
  </form>
</dialog>
</div>
</body>
</html>
